<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aria Home · Specialist Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230B47C1%27/%3E%3Cpath d=%27M16 6l8 3.5v6c0 5-3.4 8.6-8 10.5-4.6-1.9-8-5.5-8-10.5v-6z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272.4%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{--brand:#0B47C1;--bg:#F3F4F6;--card:#fff;--line:#E3E6EB;--ink:#0F1419;--muted:#5C6675;
  --ok:#1E9E62;--warn:#B76E00;--warn-bg:#FFF4E0;--bad:#C8322B;--bad-bg:#FDECEB;--ok-bg:#E6F7EE;
  --ui:"Public Sans",system-ui,sans-serif;--head:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);min-height:100vh;display:flex;flex-direction:column}
.bar{background:var(--brand);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.bar b{font-family:var(--head);font-size:17px;display:flex;align-items:center;gap:10px}
.bar .st{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85;display:flex;gap:16px;align-items:center}
.bar .st i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2FD98A;margin-right:6px}
main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:28px 24px;display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:960px){main{grid-template-columns:1.2fr .8fr}}
h1{font:700 30px/1.1 var(--head);letter-spacing:-.025em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.pill{display:inline-block;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#EEF3FF;color:var(--brand)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.ring{border:2px solid var(--brand);animation:ring 1.1s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(11,71,193,.35)}50%{box-shadow:0 0 0 12px rgba(11,71,193,0)}}
.who{display:flex;align-items:center;gap:14px;margin:14px 0 8px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px var(--head)}
.who .n{font:700 20px var(--head);letter-spacing:-.02em} .who .m{font:12px var(--mono);color:var(--muted)}
.brief{font-size:16px;line-height:1.55;margin:12px 0}
.steps{margin:6px 0 0;padding-left:20px} .steps li{margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{font:600 15px var(--ui);border-radius:8px;padding:12px 18px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.accept{background:var(--ok);border-color:var(--ok);color:#fff} .decline{background:var(--bad-bg);border-color:transparent;color:var(--bad)} .end{background:var(--bad);border-color:var(--bad);color:#fff}
.quiet{color:var(--muted);text-align:center;padding:40px 10px}
#live{display:none} #live.on{display:block}
.viz{display:flex;justify-content:center;gap:3px;height:40px;align-items:center;margin:10px 0}
.viz i{width:3px;height:6px;border-radius:2px;background:#C6CBD3;display:block} .calling .viz i{background:var(--brand);animation:eq 1s ease-in-out infinite}
.viz i:nth-child(odd){animation-delay:.15s} @keyframes eq{0%,100%{height:6px}50%{height:32px}}
#script{max-height:260px;overflow:auto;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.line{margin:0 0 10px;font-size:14.5px} .line b{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;display:block;color:var(--muted)}
.line.them b{color:var(--brand)}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .h:last-child{border-bottom:0}
.pin{display:flex;gap:8px} input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;flex:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bar">
  <b><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 3.5V12c0 5.2-3.4 8.9-8 10.5C7.4 20.9 4 17.2 4 12V6.5z" stroke="#fff" stroke-width="1.8"/></svg>Aria Home · Specialist Desk</b>
  <span class="st"><span><i></i><span id="conn">Connecting</span></span><span id="me"></span></span>
</div>

<main>
  <section>
    <h1>Incoming transfers</h1>
    <p class="sub">Ember rings this desk with a brief before you pick up.</p>

    <div class="card" id="gate">
      <p class="eyebrow">Desk sign-in</p>
      <div class="pin"><input id="name" placeholder="Your name" autocomplete="name"><input id="pin" type="password" placeholder="Desk PIN"><button id="go">Open desk</button></div>
    </div>

    <div id="queue"></div>

    <div class="card" id="live">
      <p class="eyebrow">On the line</p>
      <div class="who"><span class="avatar" id="lv-av"></span><div><div class="n" id="lv-name"></div><div class="m" id="lv-meta"></div></div></div>
      <div class="viz" id="viz"></div>
      <div class="row"><button class="end" id="hang">End call</button></div>
      <div id="script"></div>
    </div>
  </section>

  <aside>
    <div class="card hist"><p class="eyebrow">Recent</p><div id="hist"><div class="quiet">Nothing yet</div></div></div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('viz').innerHTML = '<i></i>'.repeat(21);
let pin = localStorage.getItem('deskPin') || '', me = localStorage.getItem('deskName') || '';
let room = null, active = null, seen = new Set(), ringer = null;

function headers(){ return {'X-Desk-Pin': pin, 'Content-Type': 'application/json'}; }
function openDesk(){ $('gate').style.display = 'none'; $('me').textContent = me; poll(); setInterval(poll, 2000); }
$('go').onclick = () => { me = $('name').value.trim() || 'Specialist'; pin = $('pin').value; localStorage.setItem('deskPin', pin); localStorage.setItem('deskName', me); openDesk(); };
if (pin && me) { openDesk(); }

/* ring tone: two soft tones, no asset needed */
function ring(on){
  if (!on) { if (ringer) { clearInterval(ringer); ringer = null; } return; }
  if (ringer) return;
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const beep = (f, t) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = .05; o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .18); };
  const tone = () => { beep(880, 0); beep(1100, .22); };
  tone(); ringer = setInterval(tone, 1800);
}

async function poll(){
  try {
    const r = await fetch('/api/handoffs', {headers: headers()});
    if (r.status === 401) { $('conn').textContent = 'Wrong PIN'; $('gate').style.display = ''; return; }
    const d = await r.json(); $('conn').textContent = 'Online';
    const ringing = d.handoffs.filter(h => h.status === 'ringing');
    render(ringing); renderHist(d.handoffs.filter(h => h.status !== 'ringing'));
    ring(ringing.length > 0 && !room);
  } catch { $('conn').textContent = 'Offline'; }
}

function moodClass(m){ return /frustrated|upset/.test(m) ? 'bad' : /worried/.test(m) ? 'warn' : 'ok'; }
function initials(n){ return String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function render(items){
  if (!items.length) { $('queue').innerHTML = room ? '' : '<div class="card"><div class="quiet">No calls waiting</div></div>'; return; }
  $('queue').innerHTML = items.map(h => {
    const b = h.brief || {}, c = h.caller || {};
    return `<div class="card ring" style="margin-bottom:14px">
      <span class="pill">Transfer · ${esc(h.department)}</span>
      <div class="who"><span class="avatar">${initials(c.name)}</span><div><div class="n">${esc(c.name || 'Caller')}</div><div class="m">${esc(c.account || 'not identified')} · room ${esc(h.room)}</div></div></div>
      <p class="brief">${esc(b.summary || '')}</p>
      <div class="row" style="margin-top:0">${b.mood ? `<span class="pill ${moodClass(b.mood)}">Mood · ${esc(b.mood)}</span>` : ''}${b.urgency ? `<span class="pill ${b.urgency==='high'?'warn':''}">Urgency · ${esc(b.urgency)}</span>` : ''}</div>
      ${(b.next_steps||[]).length ? `<p class="eyebrow" style="margin-top:14px">Suggested next steps</p><ul class="steps">${b.next_steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      <div class="row"><button class="accept" data-accept="${h.id}">Accept call</button><button class="decline" data-decline="${h.id}">Decline</button></div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-accept]').forEach(b => b.onclick = () => accept(b.dataset.accept, items.find(h => h.id === b.dataset.accept)));
  document.querySelectorAll('[data-decline]').forEach(b => b.onclick = () => decline(b.dataset.decline));
}

function renderHist(items){
  $('hist').innerHTML = items.length ? items.slice(0,8).map(h => `<div class="h"><span>${esc((h.caller||{}).name||'Caller')} · ${esc(h.department)}</span><span class="pill ${h.status==='accepted'?'ok':'bad'}">${esc(h.status)}</span></div>`).join('') : '<div class="quiet">Nothing yet</div>';
}

async function accept(id, h){
  ring(false);
  const r = await fetch(`/api/handoffs/${id}/accept`, {method:'POST', headers: headers(), body: JSON.stringify({name: me})});
  if (!r.ok) return;
  const d = await r.json(); active = h;
  const c = h.caller || {};
  $('lv-av').textContent = initials(c.name); $('lv-name').textContent = c.name || 'Caller'; $('lv-meta').textContent = `${c.account || ''} · ${h.department}`;
  $('script').innerHTML = ''; $('live').classList.add('on'); $('queue').innerHTML = '';
  room = new LivekitClient.Room({adaptiveStream:true});
  room.on(LivekitClient.RoomEvent.TrackSubscribed, t => { if (t.kind === 'audio') t.attach().play(); });
  room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segs, p) => { for (const s of segs) if (s.final) addLine(s.text, p && p.identity === room.localParticipant.identity ? 'you' : (p && /^specialist|human/.test(p.identity) ? 'you' : 'them')); });
  room.on(LivekitClient.RoomEvent.Disconnected, endUi);
  await room.connect(d.url, d.token);
  await room.localParticipant.setMicrophoneEnabled(true);
  document.body.classList.add('calling');
}
async function decline(id){ ring(false); await fetch(`/api/handoffs/${id}/decline`, {method:'POST', headers: headers(), body: JSON.stringify({reason:'no specialist available'})}); poll(); }
function addLine(t, who){ const el = document.createElement('p'); el.className = 'line ' + who; el.innerHTML = `<b>${who==='you'?'You':'Caller / Ember'}</b>${esc(t)}`; $('script').append(el); $('script').scrollTop = 1e6; }
$('hang').onclick = async () => { if (room) await room.disconnect(); endUi(); };
function endUi(){ room = null; document.body.classList.remove('calling'); $('live').classList.remove('on'); poll(); }
</script>
</body>
</html>
